name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit testleri
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK derle
        run: ./gradlew --no-daemon assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: kok-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Room şemasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          retention-days: 30

      - name: Test raporları (hata olursa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7
